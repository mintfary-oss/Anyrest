##############################################################################
# Anyrest — Docker Compose Stack
#
# Запуск:
#   cd /opt/anyrest && docker compose up -d --build
##############################################################################

services:

  # ── Signaling server ──────────────────────────────────────────────────────
  signal:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        CMD: signal
    image: anyrest-signal:latest
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET:-change-me-please}
    command:
      - "-addr=:8080"
      - "-relay=relay:8081"
    expose:
      - "8080"
    networks:
      - anyrest-internal
    healthcheck:
      # wget проверяет HTTP /health endpoint сигнального сервера
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Relay server ──────────────────────────────────────────────────────────
  relay:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        CMD: relay
    image: anyrest-relay:latest
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET:-change-me-please}
    command:
      - "-addr=:8081"
    ports:
      - "8081:8081"
    networks:
      - anyrest-internal
    healthcheck:
      # nc из busybox проверяет что TCP-порт открыт
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Web (NGINX + React) ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: anyrest-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Сертификаты генерируются скриптом certs/gen-certs.sh
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      signal:
        condition: service_healthy
    networks:
      - anyrest-internal

networks:
  anyrest-internal:
    driver: bridge
