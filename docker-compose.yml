##############################################################################
# Anyrest — Docker Compose Stack
#
# Services:
#   web    — NGINX: React client + TLS termination + /ws proxy  (80, 443)
#   signal — WebSocket signaling server                         (internal)
#   relay  — TCP relay for P2P fallback                        (8081)
#
# Before first run:
#   cd certs && ./gen-certs.sh
#
# Start:
#   docker compose up -d
#
# Agent (run on each managed host):
#   docker compose -f docker-compose.agent.yml up -d
##############################################################################

services:

  # ── Signaling server ──────────────────────────────────────────────────────
  signal:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        CMD: signal
    image: anyrest-signal:latest
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET:-change-me-please}
    command:
      - "-addr=:8080"
      - "-relay=relay:8081"
    expose:
      - "8080"
    networks:
      - anyrest-internal
    healthcheck:
      test: ["CMD", "/anyrest-server", "-help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Relay server ──────────────────────────────────────────────────────────
  relay:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        CMD: relay
    image: anyrest-relay:latest
    restart: unless-stopped
    environment:
      RELAY_SECRET: ${RELAY_SECRET:-change-me-please}
    command:
      - "-addr=:8081"
    ports:
      - "8081:8081"
    networks:
      - anyrest-internal
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Web (NGINX + React) ───────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: anyrest-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificates generated by certs/gen-certs.sh
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - signal
    networks:
      - anyrest-internal

networks:
  anyrest-internal:
    driver: bridge
