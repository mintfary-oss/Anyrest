##############################################################################
# Anyrest NGINX Configuration
##############################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile          on;
    keepalive_timeout 65;
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ──────────────────────────────────────────────────
    server {
        listen 443 ssl default_server;
        server_name _;

        # Certificates generated by certs/gen-certs.sh
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.2 / 1.3 only, modern cipher list on one line
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options    "nosniff"          always;
        add_header X-Frame-Options           "SAMEORIGIN"       always;

        root  /usr/share/nginx/html;
        index index.html;

        # ── WebSocket → signaling server ──────────────────────────────────
        location /ws {
            proxy_pass         http://signal:8080;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Health check ──────────────────────────────────────────────────
        location /health {
            proxy_pass http://signal:8080/health;
        }

        # ── CA-сертификат для скачивания ──────────────────────────────────
        # Пользователь открывает https://SERVER_IP/certs/ca.crt и
        # устанавливает в браузер — после этого нет предупреждений.
        location = /certs/ca.crt {
            alias        /etc/nginx/certs/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header   Content-Disposition 'attachment; filename="anyrest-ca.crt"';
            add_header   Cache-Control       "no-store";
        }

        # ── Static React app ──────────────────────────────────────────────
        # Regex assets location must come BEFORE the prefix location /
        location ~* \.(js|css|png|svg|ico|woff2?)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
