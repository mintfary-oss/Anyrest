##############################################################################
# Anyrest Agent — запуск на управляемом ПК
#
# Использование:
#   ANYREST_SIGNAL_URL=wss://SERVER_IP/ws docker compose -f docker-compose.agent.yml up -d
#
# Или через install.sh:
#   bash install.sh --agent --ip SERVER_IP
##############################################################################

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: anyrest-agent:latest
    restart: unless-stopped
    # host network нужен чтобы WebRTC ICE кандидаты видели реальные IP интерфейсов
    network_mode: host
    environment:
      DISPLAY: "${DISPLAY:-:0}"
    volumes:
      # CA-сертификат монтируется чтобы агент доверял WSS-серверу
      - /opt/anyrest/certs:/opt/anyrest/certs:ro
      # X11 сокет для захвата экрана и инъекции ввода
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      - "-signal=${ANYREST_SIGNAL_URL:-wss://localhost/ws}"
      - "-fps=15"
      - "-quality=75"
      - "-display=0"
